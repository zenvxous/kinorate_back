services:
  api:
    build:
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - app/conf/.env
    depends_on:
      - contentdb

  kinoratedb:
    image: postgres:16
    container_name: kinoratedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASS}
      - PGDATA=/var/lib/postgresql/data/pgdata

volumes:
  postgres_data:
